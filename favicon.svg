<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#090d16"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Neural hexagon / node symbol -->
  <circle cx="32" cy="32" r="7" fill="url(#grad)" filter="url(#glow)"/>
  <circle cx="18" cy="22" r="4.5" fill="#38bdf8"/>
  <circle cx="46" cy="22" r="4.5" fill="#a855f7"/>
  <circle cx="18" cy="42" r="4.5" fill="#10b981"/>
  <circle cx="46" cy="42" r="4.5" fill="#6366f1"/>
  <line x1="18" y1="22" x2="32" y2="32" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.8"/>
  <line x1="46" y1="22" x2="32" y2="32" stroke="#a855f7" stroke-width="1.8" stroke-opacity="0.8"/>
  <line x1="18" y1="42" x2="32" y2="32" stroke="#10b981" stroke-width="1.8" stroke-opacity="0.8"/>
  <line x1="46" y1="42" x2="32" y2="32" stroke="#6366f1" stroke-width="1.8" stroke-opacity="0.8"/>
</svg>